name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write infra env
        run: |
          cat > packages/infra/.env <<'EOF'
          ALCHEMY_PASSWORD=${{ secrets.ALCHEMY_PASSWORD }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EXPO_ACCESS_TOKEN=${{ secrets.EXPO_ACCESS_TOKEN }}
          PUBLIC_WEB_URL=${{ secrets.PUBLIC_WEB_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          VONAGE_API_KEY=${{ secrets.VONAGE_API_KEY }}
          VONAGE_API_SECRET=${{ secrets.VONAGE_API_SECRET }}
          VONAGE_FROM_NUMBER=${{ secrets.VONAGE_FROM_NUMBER }}
          POLAR_ACCESS_TOKEN=${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET=${{ secrets.POLAR_WEBHOOK_SECRET }}
          POLAR_PRODUCT_IDS=${{ secrets.POLAR_PRODUCT_IDS }}
          EOF

      - name: Deploy to Cloudflare (live_chrisdev)
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun x alchemy deploy --yes --stage live_chrisdev